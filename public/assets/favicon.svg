<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#180d24" stroke="#ec4899" stroke-width="2.5" />
  
  <!-- Sakura Flower -->
  <g transform="translate(32,32) scale(0.95)" filter="url(#glow)">
    <!-- 5 Petals -->
    <path d="M0,0 C-7,-18 -14,-14 -12,-6 C-10,2 -3,2 0,0" fill="url(#sakuraGrad)"/>
    <path d="M0,0 C18,-7 14,-14 6,-12 C-2,-10 -2,-3 0,0" fill="url(#sakuraGrad)" transform="rotate(72)"/>
    <path d="M0,0 C18,-7 14,-14 6,-12 C-2,-10 -2,-3 0,0" fill="url(#sakuraGrad)" transform="rotate(144)"/>
    <path d="M0,0 C18,-7 14,-14 6,-12 C-2,-10 -2,-3 0,0" fill="url(#sakuraGrad)" transform="rotate(216)"/>
    <path d="M0,0 C18,-7 14,-14 6,-12 C-2,-10 -2,-3 0,0" fill="url(#sakuraGrad)" transform="rotate(288)"/>
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="4.5" fill="#fef08a"/>
    <circle cx="0" cy="0" r="2.5" fill="#f59e0b"/>
  </g>
</svg>
