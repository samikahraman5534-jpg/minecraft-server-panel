<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" fill="none">
  <defs>
    <!-- Gradients for Wood Branches -->
    <linearGradient id="branchGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1420" />
      <stop offset="40%" stop-color="#3d1d30" />
      <stop offset="80%" stop-color="#210d19" />
      <stop offset="100%" stop-color="#14060f" />
    </linearGradient>
    <linearGradient id="branchGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a243b" />
      <stop offset="100%" stop-color="#220e1b" />
    </linearGradient>

    <!-- Petal Gradients -->
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fce7f3" />
      <stop offset="75%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="40%" stop-color="#fbcfe8" />
      <stop offset="85%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="petalGradDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sakuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Flower Symbol Definition -->
    <g id="sakuraFlower">
      <!-- 5 Petals -->
      <path d="M0,0 C-15,-20 -22,-38 0,-50 C22,-38 15,-20 0,0" fill="url(#petalGrad1)" />
      <path d="M0,0 C-15,-20 -22,-38 0,-50 C22,-38 15,-20 0,0" fill="url(#petalGrad2)" transform="rotate(72)" />
      <path d="M0,0 C-15,-20 -22,-38 0,-50 C22,-38 15,-20 0,0" fill="url(#petalGrad1)" transform="rotate(144)" />
      <path d="M0,0 C-15,-20 -22,-38 0,-50 C22,-38 15,-20 0,0" fill="url(#petalGrad2)" transform="rotate(216)" />
      <path d="M0,0 C-15,-20 -22,-38 0,-50 C22,-38 15,-20 0,0" fill="url(#petalGrad1)" transform="rotate(288)" />
      <!-- Flower Center -->
      <circle cx="0" cy="0" r="7" fill="#f43f5e" opacity="0.8" />
      <circle cx="0" cy="0" r="4" fill="#fde047" />
      <!-- Pistils -->
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#fda4af" stroke-width="1.2" />
      <circle cx="0" cy="-12" r="1.5" fill="#fef08a" />
      <line x1="0" y1="0" x2="11" y2="-5" stroke="#fda4af" stroke-width="1.2" />
      <circle cx="11" cy="-5" r="1.5" fill="#fef08a" />
      <line x1="0" y1="0" x2="7" y2="10" stroke="#fda4af" stroke-width="1.2" />
      <circle cx="7" cy="10" r="1.5" fill="#fef08a" />
      <line x1="0" y1="0" x2="-7" y2="10" stroke="#fda4af" stroke-width="1.2" />
      <circle cx="-7" cy="10" r="1.5" fill="#fef08a" />
      <line x1="0" y1="0" x2="-11" y2="-5" stroke="#fda4af" stroke-width="1.2" />
      <circle cx="-11" cy="-5" r="1.5" fill="#fef08a" />
    </g>

    <g id="sakuraFlowerSmall">
      <path d="M0,0 C-10,-14 -15,-26 0,-34 C15,-26 10,-14 0,0" fill="url(#petalGrad1)" />
      <path d="M0,0 C-10,-14 -15,-26 0,-34 C15,-26 10,-14 0,0" fill="url(#petalGrad2)" transform="rotate(72)" />
      <path d="M0,0 C-10,-14 -15,-26 0,-34 C15,-26 10,-14 0,0" fill="url(#petalGrad1)" transform="rotate(144)" />
      <path d="M0,0 C-10,-14 -15,-26 0,-34 C15,-26 10,-14 0,0" fill="url(#petalGrad2)" transform="rotate(216)" />
      <path d="M0,0 C-10,-14 -15,-26 0,-34 C15,-26 10,-14 0,0" fill="url(#petalGrad1)" transform="rotate(288)" />
      <circle cx="0" cy="0" r="4.5" fill="#f43f5e" opacity="0.8" />
      <circle cx="0" cy="0" r="2.5" fill="#fef08a" />
    </g>

    <g id="sakuraBud">
      <ellipse cx="0" cy="0" rx="6" ry="11" fill="url(#petalGradDeep)" transform="rotate(25)" />
      <ellipse cx="4" cy="2" rx="4" ry="8" fill="url(#petalGrad1)" transform="rotate(35)" />
      <path d="M-2,10 C-4,14 0,18 2,20" stroke="#3d1d30" stroke-width="2" />
    </g>

    <g id="singlePetal">
      <path d="M0,0 C-8,-10 -12,-18 0,-24 C12,-18 8,-10 0,0" fill="url(#petalGrad1)" />
    </g>
  </defs>

  <!-- Ambient Blossom Glow Area -->
  <circle cx="550" cy="180" r="240" fill="#f472b6" opacity="0.12" filter="url(#sakuraGlow)" />
  <circle cx="380" cy="280" r="160" fill="#ec4899" opacity="0.08" filter="url(#sakuraGlow)" />

  <!-- Main Wooden Branches (Starting from Top-Right 700,0 curving left & down) -->
  <g filter="url(#softGlow)">
    <!-- Primary Thick Branch -->
    <path d="M720,-20 Q620,60 520,120 T360,220 T210,340 T110,480" fill="none" stroke="url(#branchGrad1)" stroke-width="28" stroke-linecap="round" />
    <path d="M720,-20 Q620,60 520,120 T360,220 T210,340 T110,480" fill="none" stroke="url(#branchGrad2)" stroke-width="20" stroke-linecap="round" />

    <!-- Secondary Upper Branch -->
    <path d="M600,70 Q510,50 430,70 T300,120 T220,180" fill="none" stroke="url(#branchGrad1)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Secondary Middle Sub-branches -->
    <path d="M460,160 Q400,210 320,240 T240,310" fill="none" stroke="url(#branchGrad1)" stroke-width="11" stroke-linecap="round" />
    <path d="M520,120 Q560,190 530,280 T460,380" fill="none" stroke="url(#branchGrad1)" stroke-width="13" stroke-linecap="round" />
    <path d="M530,280 Q590,340 600,430" fill="none" stroke="url(#branchGrad1)" stroke-width="8" stroke-linecap="round" />

    <!-- Twigs and Fine Stems -->
    <path d="M360,220 Q320,190 280,200" fill="none" stroke="url(#branchGrad2)" stroke-width="6" stroke-linecap="round" />
    <path d="M300,120 Q280,80 250,70" fill="none" stroke="url(#branchGrad2)" stroke-width="5" stroke-linecap="round" />
    <path d="M430,70 Q420,20 380,10" fill="none" stroke="url(#branchGrad2)" stroke-width="5" stroke-linecap="round" />
    <path d="M210,340 Q160,330 130,370" fill="none" stroke="url(#branchGrad2)" stroke-width="6" stroke-linecap="round" />
    <path d="M240,310 Q220,270 180,280" fill="none" stroke="url(#branchGrad2)" stroke-width="5" stroke-linecap="round" />
    <path d="M460,380 Q430,440 370,470" fill="none" stroke="url(#branchGrad2)" stroke-width="6" stroke-linecap="round" />
    <path d="M500,340 Q530,400 500,460" fill="none" stroke="url(#branchGrad2)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Sakura Blossoms and Flowers (Clustered Richly along branches) -->
  <g filter="url(#softGlow)">
    <!-- Top-Right Origin Dense Cluster -->
    <use href="#sakuraFlower" x="650" y="40" transform="scale(1.15)" />
    <use href="#sakuraFlower" x="590" y="80" transform="rotate(15, 590, 80) scale(1.3)" />
    <use href="#sakuraFlower" x="630" y="110" transform="rotate(-25, 630, 110) scale(1.1)" />
    <use href="#sakuraFlowerSmall" x="670" y="130" transform="rotate(45, 670, 130)" />
    <use href="#sakuraBud" x="680" y="70" />

    <!-- Upper Branch Cluster -->
    <use href="#sakuraFlower" x="430" y="65" transform="rotate(35, 430, 65) scale(1.2)" />
    <use href="#sakuraFlower" x="480" y="45" transform="rotate(-15, 480, 45) scale(1.0)" />
    <use href="#sakuraFlowerSmall" x="380" y="15" transform="rotate(60, 380, 15) scale(1.1)" />
    <use href="#sakuraBud" x="350" y="10" />
    <use href="#sakuraFlower" x="300" y="115" transform="rotate(20, 300, 115) scale(1.25)" />
    <use href="#sakuraFlowerSmall" x="250" y="70" transform="rotate(-40, 250, 70)" />
    <use href="#sakuraFlower" x="220" y="175" transform="rotate(10, 220, 175) scale(1.1)" />

    <!-- Main Mid Branch Blossom Clusters -->
    <use href="#sakuraFlower" x="520" y="130" transform="rotate(-10, 520, 130) scale(1.4)" />
    <use href="#sakuraFlower" x="470" y="170" transform="rotate(40, 470, 170) scale(1.35)" />
    <use href="#sakuraFlower" x="420" y="140" transform="rotate(-30, 420, 140) scale(1.2)" />
    <use href="#sakuraFlowerSmall" x="370" y="195" transform="rotate(25, 370, 195) scale(1.2)" />
    <use href="#sakuraFlower" x="355" y="235" transform="rotate(-45, 355, 235) scale(1.3)" />
    <use href="#sakuraFlower" x="320" y="245" transform="rotate(50, 320, 245) scale(1.15)" />
    <use href="#sakuraFlowerSmall" x="275" y="200" transform="rotate(-15, 275, 200)" />
    <use href="#sakuraBud" x="260" y="180" />

    <!-- Downward Branch Cluster -->
    <use href="#sakuraFlower" x="535" y="275" transform="rotate(30, 535, 275) scale(1.3)" />
    <use href="#sakuraFlower" x="490" y="310" transform="rotate(-20, 490, 310) scale(1.2)" />
    <use href="#sakuraFlower" x="455" y="375" transform="rotate(15, 455, 375) scale(1.25)" />
    <use href="#sakuraFlowerSmall" x="495" y="455" transform="rotate(-35, 495, 455) scale(1.1)" />
    <use href="#sakuraFlowerSmall" x="375" y="465" transform="rotate(45, 375, 465) scale(1.1)" />
    <use href="#sakuraBud" x="350" y="480" />
    <use href="#sakuraFlower" x="595" y="425" transform="rotate(10, 595, 425) scale(1.15)" />
    <use href="#sakuraBud" x="620" y="445" />

    <!-- Lower Tip Cluster -->
    <use href="#sakuraFlower" x="240" y="315" transform="rotate(15, 240, 315) scale(1.3)" />
    <use href="#sakuraFlower" x="205" y="345" transform="rotate(-35, 205, 345) scale(1.25)" />
    <use href="#sakuraFlowerSmall" x="175" y="280" transform="rotate(40, 175, 280) scale(1.1)" />
    <use href="#sakuraFlower" x="135" y="365" transform="rotate(25, 135, 365) scale(1.15)" />
    <use href="#sakuraFlower" x="110" y="475" transform="rotate(-20, 110, 475) scale(1.2)" />
    <use href="#sakuraFlowerSmall" x="80" y="520" transform="rotate(30, 80, 520) scale(1.05)" />
    <use href="#sakuraBud" x="65" y="545" />
  </g>

  <!-- Floating Falling Petals around the branch -->
  <g opacity="0.95" filter="url(#softGlow)">
    <use href="#singlePetal" x="280" y="390" transform="rotate(45, 280, 390) scale(1.1)" />
    <use href="#singlePetal" x="190" y="440" transform="rotate(-60, 190, 440) scale(0.9)" />
    <use href="#singlePetal" x="140" y="520" transform="rotate(15, 140, 520) scale(1.2)" />
    <use href="#singlePetal" x="350" y="320" transform="rotate(80, 350, 320) scale(0.85)" />
    <use href="#singlePetal" x="420" y="270" transform="rotate(-40, 420, 270) scale(1.0)" />
    <use href="#singlePetal" x="480" y="410" transform="rotate(110, 480, 410) scale(0.95)" />
    <use href="#singlePetal" x="230" y="230" transform="rotate(-75, 230, 230) scale(0.9)" />
    <use href="#singlePetal" x="90" y="410" transform="rotate(30, 90, 410) scale(1.05)" />
    <use href="#singlePetal" x="50" y="580" transform="rotate(-50, 50, 580) scale(1.15)" />
  </g>

  <!-- Sparkling Glow Dots -->
  <circle cx="390" cy="180" r="3" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="480" cy="240" r="2.5" fill="#fef08a" filter="url(#softGlow)" />
  <circle cx="270" cy="280" r="3" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="160" cy="380" r="2" fill="#fef08a" filter="url(#softGlow)" />
  <circle cx="560" cy="340" r="3.5" fill="#ffffff" filter="url(#softGlow)" />
</svg>
